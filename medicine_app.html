<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Reminder App</title>
    <style>
        /* =========================================
           CSS VARIABLES & GLOBAL STYLES
           ========================================= */
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-pink: #f43f5e;
            --accent-green: #34d399;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--bg-color), #1e293b);
            color: var(--text-main);
            min-height: 100vh;
        }

        h1, h2 {
            text-align: center;
            color: var(--accent-blue);
            margin-bottom: 30px;
        }

        /* Glassmorphism utility class */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        /* =========================================
           SECTION 1: UPCOMING REMINDERS
           ========================================= */
        .cards-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 60px;
        }

        .med-card {
            padding: 25px;
            width: 250px;
            text-align: center;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .med-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .med-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .med-time {
            color: var(--accent-blue);
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        .btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn:hover {
            background: var(--accent-blue);
            color: #0f172a;
        }

        /* =========================================
           SECTION 2: WEEKLY SCHEDULE
           ========================================= */
        .schedule-section {
            max-width: 800px;
            margin: 0 auto 60px auto;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
        }

        th {
            color: var(--accent-blue);
            font-weight: 600;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* =========================================
           SECTION 3: MISSED MEDICINE ALERT
           ========================================= */
        .missed-alert-section {
            max-width: 800px;
            margin: 0 auto 60px auto;
            overflow: hidden; /* For smooth collapse */
            background: rgba(244, 63, 94, 0.05); /* Slight pink tint */
            border-color: rgba(244, 63, 94, 0.3);
        }

        .missed-summary {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-left: 4px solid var(--accent-pink);
            font-weight: bold;
            color: var(--accent-pink);
            transition: background 0.3s;
        }

        .missed-summary:hover {
            background: rgba(244, 63, 94, 0.1);
        }

        .missed-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, padding 0.4s ease-out;
            padding: 0 20px;
        }

        .missed-details.open {
            max-height: 400px;
            padding: 20px;
            border-top: 1px solid var(--glass-border);
        }

        .missed-item {
            margin-bottom: 12px;
            color: var(--text-main);
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
        }

        .missed-item:last-child {
            margin-bottom: 0;
        }

        /* =========================================
           SECTION 4: FLOATING AI DOCTOR
           ========================================= */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue), #818cf8);
            color: #fff;
            font-size: 28px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s;
        }

        .fab:hover {
            transform: scale(1.1);
        }

        .chat-panel {
            position: fixed;
            bottom: 110px;
            right: 30px;
            width: 320px;
            display: none;
            flex-direction: column;
            z-index: 1000;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.85);
        }

        .chat-panel.active {
            display: flex;
        }

        .chat-header {
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: var(--accent-blue);
        }

        .close-chat {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
            transition: color 0.3s;
        }

        .close-chat:hover {
            color: var(--accent-pink);
        }

        .chat-messages {
            height: 300px;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .msg {
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 80%;
            word-wrap: break-word;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .msg.user {
            align-self: flex-end;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .msg.bot {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            border-bottom-left-radius: 4px;
        }

        .chat-input-area {
            padding: 15px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.2);
        }

        .chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            padding: 10px;
            outline: none;
        }

        .chat-input:focus {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }

        .send-btn {
            background: var(--accent-blue);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.3s;
        }

        .send-btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h1>Medicine Reminder App</h1>

    <!-- SECTION 1: UPCOMING REMINDERS -->
    <h2>Upcoming Reminders</h2>
    <div class="cards-container" id="cards-container">
        <!-- Medicine Cards injected here via JavaScript -->
    </div>

    <!-- SECTION 2: WEEKLY SCHEDULE -->
    <div class="schedule-section glass">
        <h2>Weekly Schedule</h2>
        <table>
            <thead>
                <tr>
                    <th>Medicine Name</th>
                    <th>Time</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="schedule-body">
                <!-- Schedule Rows injected here via JavaScript -->
            </tbody>
        </table>
    </div>

    <!-- SECTION 3: MISSED MEDICINE ALERT -->
    <div class="missed-alert-section glass">
        <div class="missed-summary" id="missed-summary">
            <span id="missed-count-text">You missed 0 medicines</span>
            <span id="missed-arrow">▼</span>
        </div>
        <div class="missed-details" id="missed-details">
            <!-- Missed items injected here via JavaScript -->
        </div>
    </div>

    <!-- SECTION 4: FLOATING AI DOCTOR -->
    <button class="fab" id="fab-btn">💬</button>

    <div class="chat-panel glass" id="chat-panel">
        <div class="chat-header">
            <span>AI Doctor Advice</span>
            <button class="close-chat" id="close-chat">✖</button>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="msg bot">Hello! I am your AI Doctor. Describe your symptoms below.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" class="chat-input" placeholder="e.g. fever, cold...">
            <button class="send-btn" id="send-btn">Send</button>
        </div>
    </div>

    <script>
        // =========================================
        // DATA: PRELOADED INFORMATION
        // =========================================
        const medicines = [
            { name: "Medicine 1", time: "09:00" },
            { name: "Medicine 2", time: "14:00" },
            { name: "Medicine 3", time: "22:30" }
        ];

        const missedMedicines = [
            { name: "Medicine 1", day: "Thu", time: "09:00 AM" },
            { name: "Medicine 2", day: "Fri", time: "02:00 PM" }
        ];


        // =========================================
        // SECTION 1 & 2: RENDER CARDS & TABLE
        // =========================================
        const cardsContainer = document.getElementById('cards-container');
        const scheduleBody = document.getElementById('schedule-body');

        function renderMedicines() {
            medicines.forEach(med => {
                // 1. Render Glassmorphism Card
                const card = document.createElement('div');
                card.className = 'med-card glass';
                card.innerHTML = `
                    <div class="med-name">${med.name}</div>
                    <div class="med-time">${med.time}</div>
                    <button class="btn" onclick="markAsTaken(this)">Mark as Taken</button>
                `;
                cardsContainer.appendChild(card);

                // 2. Render Table Row (Default Pending)
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${med.name}</strong></td>
                    <td>${med.time}</td>
                    <td style="color: #fcd34d;">Pending</td>
                `;
                scheduleBody.appendChild(row);
            });
        }

        // Card button click logic
        function markAsTaken(btn) {
            btn.innerText = 'Taken';
            btn.style.background = 'var(--accent-green)';
            btn.style.color = '#0f172a';
            btn.style.borderColor = 'var(--accent-green)';
            btn.disabled = true;
        }


        // =========================================
        // SECTION 3: MISSED MEDICINE ALERTS
        // =========================================
        const missedSummary = document.getElementById('missed-summary');
        const missedDetails = document.getElementById('missed-details');
        const missedCountText = document.getElementById('missed-count-text');
        const missedArrow = document.getElementById('missed-arrow');

        function renderMissedAlerts() {
            // Set count text
            missedCountText.innerText = `You missed ${missedMedicines.length} medicines`;
            
            // Render individual missed items
            missedMedicines.forEach(missed => {
                const item = document.createElement('div');
                item.className = 'missed-item';
                item.innerHTML = `⚠️ You missed <strong>${missed.name}</strong> on ${missed.day} at ${missed.time}`;
                missedDetails.appendChild(item);
            });

            // Toggle collapse/expand logic
            missedSummary.addEventListener('click', () => {
                missedDetails.classList.toggle('open');
                missedArrow.innerText = missedDetails.classList.contains('open') ? '▲' : '▼';
            });
        }


        // =========================================
        // SECTION 4: AI DOCTOR CHATBOT
        // =========================================
        const fabBtn = document.getElementById('fab-btn');
        const chatPanel = document.getElementById('chat-panel');
        const closeChat = document.getElementById('close-chat');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const chatMessages = document.getElementById('chat-messages');

        // Toggle chat panel visibility
        fabBtn.addEventListener('click', () => {
            chatPanel.classList.add('active');
            chatInput.focus();
        });
        
        closeChat.addEventListener('click', () => {
            chatPanel.classList.remove('active');
        });

        // Function to append messages to chat area
        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${sender}`;
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv);
            
            // Auto-scroll to the latest message
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Handle sending a message and AI logic
        function handleChat() {
            const text = chatInput.value.trim();
            if (!text) return;

            // 1. Display user message
            addMessage(text, 'user');
            chatInput.value = '';

            // 2. Determine Bot Response based on keyword matching
            const lowerText = text.toLowerCase();
            let response = "Consult a doctor"; // Default fallback

            if (lowerText.includes("fever")) {
                response = "Fever → Paracetamol, drink fluids";
            } else if (lowerText.includes("cold")) {
                response = "Cold → Steam inhalation";
            }

            // 3. Simulate short delay for realistic bot reply
            setTimeout(() => {
                addMessage(response, 'bot');
            }, 600);
        }

        // Event listeners for Send button and Enter key
        sendBtn.addEventListener('click', handleChat);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleChat();
        });

        // =========================================
        // INITIALIZE APPLICATION ON LOAD
        // =========================================
        window.onload = () => {
            renderMedicines();
            renderMissedAlerts();
        };

    </script>
</body>
</html>
